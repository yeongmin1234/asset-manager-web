[alembic]
script_location = alembic
prepend_sys_path = .
timezone = UTC

# The runtime URL is loaded in alembic/env.py from app.core.config settings.
# Do not put real credentials in this file.
sqlalchemy.url = postgresql+psycopg://postgres:YOUR_LOCAL_PASSWORD@127.0.0.1:5432/asset_manager_dev

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
