services:
  postgres:
    image: postgres:16
    container_name: asset-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset_manager}
      POSTGRES_USER: ${POSTGRES_USER:-asset_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_deploy_env}
    volumes:
      - /volume6/총무/서버/자산관리 프로젝트/postgres/data:/var/lib/postgresql/data
      - /volume6/총무/서버/자산관리 프로젝트/logs/postgres:/var/log/postgresql

  backend:
    image: python:3.12-slim
    container_name: asset-manager-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - postgres
    environment:
      APP_NAME: ${APP_NAME:-Asset Manager}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-asset_user}:${POSTGRES_PASSWORD:-change_me_in_deploy_env}@postgres:5432/${POSTGRES_DB:-asset_manager}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3010}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
    volumes:
      - ../backend:/app
      - /volume6/총무/서버/자산관리 프로젝트/uploads:/data/uploads
      - /volume6/총무/서버/자산관리 프로젝트/exports:/data/exports
      - /volume6/총무/서버/자산관리 프로젝트/logs/backend:/data/logs
    ports:
      - "8010:8001"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001"

  frontend:
    image: node:22-alpine
    container_name: asset-manager-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010}
    volumes:
      - ../frontend:/app
      - /volume6/총무/서버/자산관리 프로젝트/logs/frontend:/data/logs
    ports:
      - "3010:5173"
    command: sh -c "npm install && npm run dev"
